name: Microservice CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi
          pip install pytest

      - name: Run pytest test suite
        env:
          PYTHONPATH: server
          GEMINI_API_KEY: "dummy_key_for_github_actions"
          API_KEY: "dummy_key_for_github_actions"
          ALPACA_API_KEY: "dummy_key_for_github_actions"
          ALPACA_SECRET_KEY: "dummy_key_for_github_actions"
        run: pytest server/tests/ -v

  java-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Protos and Run Java Tests
        run: |
          cd gateway
          mvn clean test