version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  python-engine:
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    volumes:
      - ./server:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy

  java-gateway:
    build: 
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GRPC_SERVER_HOST=python-engine
      - GRPC_SERVER_PORT=50051
    depends_on:
      - python-engine

  dashboard:
    build: 
      context: ./market-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - java-gateway