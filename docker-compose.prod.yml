version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: market-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  python-engine:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: python-engine
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy

  java-gateway:
    build: 
      context: .
      dockerfile: gateway/Dockerfile
    container_name: java-gateway
    restart: always
    environment:
      - GRPC_SERVER_HOST=python-engine
      - GRPC_SERVER_PORT=50051
    depends_on:
      - python-engine

  dashboard:
    build: 
      context: ./market-dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: nextjs-dashboard
    restart: always
    depends_on:
      - java-gateway

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - java-gateway

volumes:
  caddy_data:
  caddy_config: